<!DOCTYPE html>
<html lang="mn"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хөгжим — Засварлагч</title>
<style>
  :root { --primary:#2e7d32; --accent:#ff8f00; --bg:#f5f7fa; --border:#d0d0d0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Arial,sans-serif; background:var(--bg); color:#222; height:100vh; display:flex; flex-direction:column; }
  .bar { background:var(--primary); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .bar h1 { font-size:1em; flex:1; min-width:200px; font-weight:600; }
  .bar button, .bar a { padding:7px 14px; border-radius:6px; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.15); color:#fff; cursor:pointer; font-size:.9em; font-weight:600; text-decoration:none; }
  .bar button:hover, .bar a:hover { background:rgba(255,255,255,.3); }
  .bar .primary { background:var(--accent); border-color:var(--accent); }
  .bar .primary:hover { background:#ff6f00; }
  .toolbar { background:#fff; padding:8px 16px; border-bottom:1px solid var(--border); display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .toolbar button { padding:6px 10px; border:1px solid var(--border); background:#fff; border-radius:4px; cursor:pointer; font-size:.9em; min-width:34px; }
  .toolbar button:hover { background:#e8f5e9; border-color:var(--primary); }
  .toolbar select { padding:6px 8px; border:1px solid var(--border); border-radius:4px; font-size:.9em; }
  .toolbar .sep { width:1px; height:22px; background:var(--border); margin:0 4px; }
  #editor { flex:1; overflow:auto; padding:30px; background:var(--bg); }
  #page { max-width:900px; margin:0 auto; background:#fff; padding:40px 50px; min-height:calc(100vh - 200px); box-shadow:0 2px 10px rgba(0,0,0,.1); font-family:"Times New Roman",serif; font-size:14px; line-height:1.5; outline:none; }
  #page:focus { box-shadow:0 2px 15px rgba(46,125,50,.25); }
  #page table { border-collapse:collapse; margin:10px 0; width:100%; }
  #page td, #page th { border:1px solid #666; padding:6px 8px; vertical-align:top; }
  #page h1,#page h2,#page h3 { margin:12px 0 6px; }
  #page p { margin:6px 0; }
  .loading { text-align:center; padding:60px; color:#666; font-size:1.1em; }
  .err { text-align:center; padding:60px; color:#c62828; font-size:1em; }
  .status { font-size:.85em; color:rgba(255,255,255,.85); }
</style>
</head>
<body>
<div class="bar">
  <h1 id="fileTitle">Уншиж байна…</h1>
  <span class="status" id="status"></span>
  <button onclick="saveHtml()" title="Хуудсанд харагдаж буй хэлбэрээр .html файл болгож татах">💾 HTML хадгалах</button>
  <button class="primary" onclick="saveDocx()" title="Word-т нээгдэх .docx файл болгож татах">📥 Word (.docx) татах</button>
  <a href="downloads.html">← Сан руу буцах</a>
</div>

<div class="toolbar">
  <button onclick="cmd('bold')" title="Тод (Ctrl+B)"><b>B</b></button>
  <button onclick="cmd('italic')" title="Налуу (Ctrl+I)"><i>I</i></button>
  <button onclick="cmd('underline')" title="Доогуур зураас (Ctrl+U)"><u>U</u></button>
  <span class="sep"></span>
  <select onchange="cmd('formatBlock', this.value); this.value=''">
    <option value="">Хэв маяг…</option>
    <option value="H1">Гарчиг 1</option>
    <option value="H2">Гарчиг 2</option>
    <option value="H3">Гарчиг 3</option>
    <option value="P">Энгийн текст</option>
  </select>
  <select onchange="cmd('fontSize', this.value); this.value=''">
    <option value="">Хэмжээ…</option>
    <option value="2">Жижиг</option>
    <option value="3">Дунд</option>
    <option value="4">Том</option>
    <option value="5">Их том</option>
  </select>
  <span class="sep"></span>
  <button onclick="cmd('justifyLeft')" title="Зүүн">⬅</button>
  <button onclick="cmd('justifyCenter')" title="Дунд">⬛</button>
  <button onclick="cmd('justifyRight')" title="Баруун">➡</button>
  <span class="sep"></span>
  <button onclick="cmd('insertUnorderedList')" title="Цэгэн жагсаалт">• Жагс</button>
  <button onclick="cmd('insertOrderedList')" title="Тоон жагсаалт">1. Жагс</button>
  <span class="sep"></span>
  <button onclick="insertTable()" title="Хүснэгт нэмэх">⊞ Хүснэгт</button>
  <span class="sep"></span>
  <button onclick="cmd('undo')" title="Буцаах (Ctrl+Z)">↶</button>
  <button onclick="cmd('redo')" title="Дахин (Ctrl+Y)">↷</button>
</div>

<div id="editor"><div id="page" contenteditable="true"><div class="loading">Файл ачаалж байна…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const filePath = params.get('f');
const fileName = params.get('n') || 'Файл';
document.getElementById('fileTitle').textContent = '✏️ ' + fileName;

function cmd(c, v){ document.execCommand(c, false, v||null); document.getElementById('page').focus(); }
function insertTable(){
  const r = parseInt(prompt('Мөрийн тоо:', '3')) || 0;
  const c = parseInt(prompt('Баганы тоо:', '3')) || 0;
  if (!r || !c) return;
  let html = '<table>';
  for (let i=0;i<r;i++){ html+='<tr>'; for (let j=0;j<c;j++) html+='<td>&nbsp;</td>'; html+='</tr>'; }
  html += '</table><p></p>';
  document.execCommand('insertHTML', false, html);
}

let modified = false;
function setStatus(t){ document.getElementById('status').textContent = t; }

async function load(){
  if (!filePath){
    document.getElementById('page').innerHTML = '<div class="err">⚠️ Файлын зам заагаагүй байна. downloads.html-с орж ирнэ үү.</div>';
    return;
  }
  try {
    const res = await fetch(filePath);
    if (!res.ok) throw new Error('Файлыг серверээс уншиж чадсангүй ('+res.status+')');
    const buf = await res.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer: buf}, {
      styleMap: [
        "p[style-name='Heading 1'] => h1",
        "p[style-name='Heading 2'] => h2",
        "p[style-name='Heading 3'] => h3"
      ]
    });
    document.getElementById('page').innerHTML = result.value || '<p><em>Хоосон баримт</em></p>';
    setStatus('Ачаалагдлаа · засварлаж болно');
  } catch (e) {
    document.getElementById('page').innerHTML = `<div class="err">⚠️ ${e.message}<br><br><b>АСААХ.bat</b>-ыг ажиллуулсан эсэхээ шалгана уу. Локал сервертэй үед л ажиллана.</div>`;
  }
}

document.getElementById('page').addEventListener('input', () => {
  modified = true; setStatus('● Өөрчлөгдсөн');
});
window.addEventListener('beforeunload', e => {
  if (modified) { e.preventDefault(); e.returnValue = ''; }
});

function saveHtml(){
  const style = `<style>body{font-family:"Times New Roman",serif;font-size:14px;line-height:1.5;padding:40px;max-width:900px;margin:0 auto} table{border-collapse:collapse;margin:10px 0;width:100%} td,th{border:1px solid #666;padding:6px 8px}</style>`;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${fileName}</title>${style}</head><body>${document.getElementById('page').innerHTML}</body></html>`;
  downloadBlob(new Blob([html], {type:'text/html;charset=utf-8'}), fileName.replace(/\.docx?$/i,'') + '_засварласан.html');
  modified = false; setStatus('HTML хадгалагдлаа');
}

function saveDocx(){
  // Simple HTML → docx wrapper (Word opens HTML with .doc extension)
  const html = document.getElementById('page').innerHTML;
  const doc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${fileName}</title>
<style>body{font-family:"Times New Roman",serif;font-size:14px;line-height:1.5} table{border-collapse:collapse;margin:10px 0} td,th{border:1px solid #666;padding:6px 8px}</style>
</head><body>${html}</body></html>`;
  downloadBlob(new Blob(['﻿'+doc], {type:'application/msword'}), fileName.replace(/\.docx?$/i,'') + '_засварласан.doc');
  modified = false; setStatus('Word файл татагдлаа');
}

function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

load();
</script>
</body></html>
